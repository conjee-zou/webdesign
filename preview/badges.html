<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: var(--bg-elev-1); }
  body { padding: 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-sans); font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 999px; border: 1px solid transparent; }
  .b-neutral { background: var(--neutral-100); color: var(--neutral-700); }
  .b-primary { background: var(--primary-50); color: var(--primary-700); }
  .b-success { background: var(--success-100); color: #166534; }
  .b-warning { background: var(--warning-100); color: #92400e; }
  .b-danger { background: var(--danger-100); color: #991b1b; }
  .b-outline { background: transparent; border-color: var(--border-2); color: var(--fg-2); }
  .dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; }
</style>
</head>
<body>
  <span class="badge b-neutral">Draft</span>
  <span class="badge b-primary"><span class="dot"></span>Active</span>
  <span class="badge b-success">Published</span>
  <span class="badge b-warning">Pending</span>
  <span class="badge b-danger">Failed</span>
  <span class="badge b-outline">v1.2.0</span>
</body>
</html>
