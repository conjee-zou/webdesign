<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: var(--bg-elev-1); }
  body { padding: 20px; }
  .row { display:flex; gap: 8px; }
  .sw { flex: 1; aspect-ratio: 1.2; border-radius: 10px; display:flex; flex-direction:column; justify-content: flex-end; padding: 8px 10px; border: 1px solid var(--border-1); font-family: var(--font-mono); font-size: 10px; }
  .hex { opacity: 0.75; }
  .n { font-weight: 600; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:#fafaf9; color:#111110;"><span class="n">50</span><span class="hex">#fafaf9</span></div>
    <div class="sw" style="background:#f4f4f2; color:#111110;"><span class="n">100</span><span class="hex">#f4f4f2</span></div>
    <div class="sw" style="background:#e8e8e4; color:#111110;"><span class="n">200</span><span class="hex">#e8e8e4</span></div>
    <div class="sw" style="background:#d4d4cf; color:#22221f;"><span class="n">300</span><span class="hex">#d4d4cf</span></div>
    <div class="sw" style="background:#a3a39d; color:#fff;"><span class="n">400</span><span class="hex">#a3a39d</span></div>
    <div class="sw" style="background:#73736d; color:#fff;"><span class="n">500</span><span class="hex">#73736d</span></div>
    <div class="sw" style="background:#52524d; color:#fff;"><span class="n">600</span><span class="hex">#52524d</span></div>
    <div class="sw" style="background:#3a3a36; color:#fff;"><span class="n">700</span><span class="hex">#3a3a36</span></div>
    <div class="sw" style="background:#22221f; color:#fff;"><span class="n">800</span><span class="hex">#22221f</span></div>
    <div class="sw" style="background:#111110; color:#fff;"><span class="n">900</span><span class="hex">#111110</span></div>
  </div>
</body>
</html>
