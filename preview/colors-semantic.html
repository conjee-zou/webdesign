<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: var(--bg-elev-1); }
  body { padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .tile { border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--border-1); font-family: var(--font-sans); }
  .dot { width: 24px; height: 24px; border-radius: 999px; }
  .name { font-weight: 600; font-size: 13px; color: var(--fg-1); }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
</style>
</head>
<body>
  <div class="grid">
    <div class="tile"><div class="dot" style="background:#16a34a"></div><span class="name">Success</span><span class="hex">500 · #16a34a</span></div>
    <div class="tile"><div class="dot" style="background:#d97706"></div><span class="name">Warning</span><span class="hex">500 · #d97706</span></div>
    <div class="tile"><div class="dot" style="background:#dc2626"></div><span class="name">Danger</span><span class="hex">500 · #dc2626</span></div>
    <div class="tile"><div class="dot" style="background:#0284c7"></div><span class="name">Info</span><span class="hex">500 · #0284c7</span></div>
  </div>
</body>
</html>
