<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: var(--bg-elev-1); }
  body { padding: 18px 20px; font-family: var(--font-sans); font-size: 13px; }
  .list { border: 1px solid var(--border-1); border-radius: 12px; overflow: hidden; background: var(--bg-elev-1); }
  .item { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-bottom: 1px solid var(--border-1); cursor: pointer; transition: background var(--dur-fast); }
  .item:last-child { border-bottom: none; }
  .item:hover { background: var(--neutral-50); }
  .item.sel { background: var(--primary-50); }
  .ic { width: 32px; height: 32px; border-radius: 8px; background: var(--neutral-100); display:flex; align-items:center; justify-content:center; color: var(--fg-2); font-weight:600; font-size: 12px; }
  .who { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .name { font-weight: 500; color: var(--fg-1); }
  .meta { font-size: 12px; color: var(--fg-3); }
  .chev { color: var(--fg-4); }
</style>
</head>
<body>
  <div class="list">
    <div class="item sel"><div class="ic" style="background:var(--primary-100);color:var(--primary-700);">📁</div><div class="who"><span class="name">Design system v2</span><span class="meta">12 pages · edited 4 min ago</span></div><span class="chev">›</span></div>
    <div class="item"><div class="ic">📁</div><div class="who"><span class="name">Q2 roadmap</span><span class="meta">Private · you</span></div><span class="chev">›</span></div>
    <div class="item"><div class="ic">📄</div><div class="who"><span class="name">Onboarding notes</span><span class="meta">Shared with 3 people</span></div><span class="chev">›</span></div>
  </div>
</body>
</html>
