<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: var(--bg-elev-1); }
  body { padding: 20px; }
  .grid { display:grid; grid-template-columns: repeat(8, 1fr); gap: 10px; align-items: end; }
  .item { display:flex; flex-direction:column; align-items:flex-start; gap: 6px; }
  .blk { background: var(--primary-600); border-radius: 3px; }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
  .val { font-family: var(--font-sans); font-size: 11px; color: var(--fg-1); font-weight: 600; }
  .formula { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); margin-bottom: 12px; }
  .formula b { color: var(--fg-1); font-weight: 600; }
</style>
</head>
<body>
  <div class="formula"><b>Fibonacci</b> · 4 + 8 = 12 · 8 + 12 = 20 · 12 + 20 = 32 · 20 + 32 = 52 · 32 + 52 = 84 …</div>
  <div class="grid">
    <div class="item"><div class="blk" style="width:4px;height:4px"></div><span class="val">1</span><span class="lbl">4px</span></div>
    <div class="item"><div class="blk" style="width:8px;height:8px"></div><span class="val">2</span><span class="lbl">8px</span></div>
    <div class="item"><div class="blk" style="width:12px;height:12px"></div><span class="val">3</span><span class="lbl">12px</span></div>
    <div class="item"><div class="blk" style="width:20px;height:20px"></div><span class="val">4</span><span class="lbl">20px</span></div>
    <div class="item"><div class="blk" style="width:32px;height:32px"></div><span class="val">5</span><span class="lbl">32px</span></div>
    <div class="item"><div class="blk" style="width:52px;height:52px"></div><span class="val">6</span><span class="lbl">52px</span></div>
    <div class="item"><div class="blk" style="width:84px;height:84px"></div><span class="val">7</span><span class="lbl">84px</span></div>
    <div class="item"><div class="blk" style="width:136px;height:136px"></div><span class="val">8</span><span class="lbl">136px</span></div>
  </div>
</body>
</html>
