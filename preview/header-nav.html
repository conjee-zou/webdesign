<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: var(--bg-elev-1); }
  body { padding: 14px 20px; font-family: var(--font-sans); }
  .nav { display: flex; align-items: center; justify-content: space-between; padding-bottom: 14px; border-bottom: 1px solid var(--border-1); }
  .left, .right { display:flex; align-items:center; gap: 18px; }
  .brand { display:flex; align-items:center; gap: 10px; font-weight: 600; color: var(--fg-1); font-size: 15px; }
  .mark { width: 24px; height: 24px; border-radius: 6px; background: var(--primary-600); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size: 12px; }
  .link { font-size: 14px; color: var(--fg-2); cursor: pointer; }
  .link:hover { color: var(--fg-1); }
  .link.active { color: var(--fg-1); font-weight: 500; }
  .btn { font-size: 13px; font-weight: 500; padding: 7px 14px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; }
  .btn-ghost { background: transparent; color: var(--fg-1); }
  .btn-primary { background: var(--primary-600); color: #fff; }
</style>
</head>
<body>
  <div class="nav">
    <div class="left">
      <div class="brand"><div class="mark">W</div>Webdesign</div>
      <span class="link active">Product</span>
      <span class="link">Pricing</span>
      <span class="link">Docs</span>
      <span class="link">Changelog</span>
    </div>
    <div class="right">
      <button class="btn btn-ghost">Sign in</button>
      <button class="btn btn-primary">Get started</button>
    </div>
  </div>
</body>
</html>
