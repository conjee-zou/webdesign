<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: var(--bg-elev-1); }
  body { padding: 20px; }
  .row { display:flex; gap: 8px; }
  .sw { flex: 1; aspect-ratio: 1.2; border-radius: 10px; display:flex; flex-direction:column; justify-content: flex-end; padding: 8px 10px; border: 1px solid var(--border-1); font-family: var(--font-mono); font-size: 10px; }
  .sw .hex { color: inherit; opacity: 0.75; }
  .sw .n { font-weight: 600; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:#eef1ff; color:#2f2b8f;"><span class="n">50</span><span class="hex">#eef1ff</span></div>
    <div class="sw" style="background:#e0e5ff; color:#2f2b8f;"><span class="n">100</span><span class="hex">#e0e5ff</span></div>
    <div class="sw" style="background:#c7d0ff; color:#2f2b8f;"><span class="n">200</span><span class="hex">#c7d0ff</span></div>
    <div class="sw" style="background:#a4b1ff; color:#1f1c5c;"><span class="n">300</span><span class="hex">#a4b1ff</span></div>
    <div class="sw" style="background:#7b87fa; color:#fff;"><span class="n">400</span><span class="hex">#7b87fa</span></div>
    <div class="sw" style="background:#5b63ef; color:#fff;"><span class="n">500</span><span class="hex">#5b63ef</span></div>
    <div class="sw" style="background:#4741d8; color:#fff;"><span class="n">600★</span><span class="hex">#4741d8</span></div>
    <div class="sw" style="background:#3a33b3; color:#fff;"><span class="n">700</span><span class="hex">#3a33b3</span></div>
    <div class="sw" style="background:#2f2b8f; color:#fff;"><span class="n">800</span><span class="hex">#2f2b8f</span></div>
    <div class="sw" style="background:#1f1c5c; color:#fff;"><span class="n">900</span><span class="hex">#1f1c5c</span></div>
  </div>
</body>
</html>
