<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: var(--bg-elev-1); }
  body { padding: 20px; }
  .formula { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); margin-bottom: 12px; }
  .formula b { color: var(--fg-1); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; align-items: end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 72px; height: 56px; background: var(--primary-50); border: 1.5px solid var(--primary-400); }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
  .val { font-family: var(--font-sans); font-size: 11px; color: var(--fg-1); font-weight: 600; }
</style>
</head>
<body>
  <div class="formula"><b>Fibonacci</b> · 4 + 8 = 12 · 8 + 12 = 20 · 12 + 20 = 32 · 20 + 32 = 52 …</div>
  <div class="grid">
    <div class="item"><div class="box" style="border-radius:4px"></div><span class="val">xs</span><span class="lbl">4px</span></div>
    <div class="item"><div class="box" style="border-radius:8px"></div><span class="val">sm</span><span class="lbl">8px</span></div>
    <div class="item"><div class="box" style="border-radius:12px"></div><span class="val">md</span><span class="lbl">12px</span></div>
    <div class="item"><div class="box" style="border-radius:20px"></div><span class="val">lg</span><span class="lbl">20px</span></div>
    <div class="item"><div class="box" style="border-radius:32px"></div><span class="val">xl</span><span class="lbl">32px</span></div>
    <div class="item"><div class="box" style="border-radius:52px"></div><span class="val">2xl</span><span class="lbl">52px</span></div>
    <div class="item"><div class="box" style="border-radius:9999px"></div><span class="val">full</span><span class="lbl">pill</span></div>
  </div>
</body>
</html>
