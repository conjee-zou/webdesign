<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: var(--bg-elev-1); }
  body { padding: 16px 20px; font-family: var(--font-sans); }
  .welcome { text-align: center; padding: 20px 12px; }
  .mark { width: 48px; height: 48px; border-radius: 12px; background: var(--primary-600); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-weight:700; font-size: 18px; margin-bottom: 12px; box-shadow: var(--shadow-md); }
  h2 { font-family: var(--font-sans); font-size: 36px; line-height: 1.05; color: var(--fg-1); margin: 0 0 6px; font-weight: 600; }
  p { font-size: 15px; color: var(--fg-2); margin: 0 auto; max-width: 480px; }
  .actions { margin-top: 16px; display: inline-flex; gap: 8px; }
  .btn { font-size: 14px; font-weight: 500; padding: 10px 18px; border-radius: 10px; border: 1px solid transparent; cursor: pointer; }
  .btn-p { background: var(--primary-600); color: #fff; }
  .btn-s { background: var(--bg-elev-1); color: var(--fg-1); border-color: var(--border-2); }
</style>
</head>
<body>
  <div class="welcome">
    <div class="mark">W</div>
    <h2>Welcome to your workspace</h2>
    <p>Start by inviting your team, then create your first project. You can always change these later.</p>
    <div class="actions">
      <button class="btn btn-p">Invite teammates</button>
      <button class="btn btn-s">Create project</button>
    </div>
  </div>
</body>
</html>
