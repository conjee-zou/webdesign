<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: var(--bg-elev-1); }
  body { padding: 20px; }
  .scale { display:flex; align-items:baseline; gap: 16px; flex-wrap:wrap; }
  .scale .row { display:flex; align-items:baseline; gap: 14px; }
  .scale .label { color: var(--fg-3); font-size: 11px; font-family: var(--font-mono); width: 46px; }
  .serif-display { font-family: var(--font-serif); font-size: 44px; line-height: 1.05; color: var(--fg-1); }
  .sans-h1 { font-family: var(--font-sans); font-weight: 700; font-size: 32px; color: var(--fg-1); }
  .sans-body { font-family: var(--font-sans); font-size: 16px; color: var(--fg-2); line-height: 1.5; }
</style>
</head>
<body>
  <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: center;">
    <div>
      <div class="serif-display">Quietly confident</div>
      <div style="color: var(--fg-3); font-family: var(--font-mono); font-size: 11px; margin-top: 6px;">Instrument Serif · 44 / 1.05</div>
    </div>
    <div>
      <div class="sans-h1">Invite your team</div>
      <div class="sans-body" style="margin-top: 8px;">A confident heading with a calm, readable body paragraph set in Inter at 16/24.</div>
      <div style="color: var(--fg-3); font-family: var(--font-mono); font-size: 11px; margin-top: 8px;">Roboto 700 · 32 / 1.15 + Roboto 400 · 16 / 1.5</div>
    </div>
  </div>
</body>
</html>
